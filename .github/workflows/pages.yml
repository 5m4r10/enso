name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test
      - name: Stamp the service worker version
        run: |
          sed -i "s/^const VERSION = 'dev';/const VERSION = '${GITHUB_SHA}';/" web/sw.js
          grep -q "^const VERSION = '${GITHUB_SHA}';" web/sw.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
  # Separate job: deploying right after the upload raced with GitHub listing the artifact.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
